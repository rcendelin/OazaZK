name: Build and Deploy (PROD)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '22.x'
  AZURE_FUNCTIONAPP_NAME: func-oaza-prod
  AZURE_RESOURCE_GROUP: rg-oaza-prod

jobs:
  build-api:
    name: Build & Test API
    runs-on: ubuntu-24.04
    services:
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite
        ports:
          - 10000:10000
          - 10001:10001
          - 10002:10002
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore Oaza.sln

      - name: Build
        run: dotnet build Oaza.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Oaza.sln --configuration Release --no-restore --verbosity normal

      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          dotnet publish src/Oaza.Functions/Oaza.Functions.csproj --configuration Release --output ./publish
          cp -r src/Oaza.Functions/bin/Release/net8.0/.azurefunctions ./publish/.azurefunctions 2>/dev/null || true

      - name: Upload API artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: api-artifact
          path: api/publish
          include-hidden-files: true

  build-web:
    name: Build Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy-api:
    name: Deploy API (PROD)
    needs: [build-api, build-web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Download API artifact
        uses: actions/download-artifact@v8
        with:
          name: api-artifact
          path: api-artifact

      - name: Create deployment ZIP
        run: cd api-artifact && zip -r ../deploy.zip . && cd ..

      - name: Azure Login
        uses: Azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Functions
        run: |
          az functionapp deployment source config-zip \
            --name ${{ env.AZURE_FUNCTIONAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --src deploy.zip

  deploy-web:
    name: Deploy Frontend (PROD)
    needs: [build-api, build-web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v7

      # Built here, not in build-web: environment-scoped secrets (PROD_*) are visible only to jobs with `environment:`.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend for production
        working-directory: web
        run: |
          test -n "$VITE_API_BASE_URL" || { echo "::error::PROD_API_BASE_URL secret is empty"; exit 1; }
          npm ci
          npm run build
        env:
          VITE_ENTRA_CLIENT_ID: ${{ secrets.PROD_ENTRA_CLIENT_ID }}
          VITE_ENTRA_TENANT_ID: ${{ secrets.PROD_ENTRA_TENANT_ID }}
          VITE_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}
          VITE_ENVIRONMENT: prod

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.PROD_SWA_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: web/dist
          skip_app_build: true
          skip_api_build: true
